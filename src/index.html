<!DOCTYPE html>
<!--
  index.html
  Pagina principale della Bacheca QR (quella a cui porta il QR code),
  impaginata come un profilo social: barra in alto con il logo, profilo con
  descrizione e link degli educatori, post in griglia o in elenco, barra di
  navigazione in basso con tre viste:
    #bacheca  profilo e post
    #nuovo    pubblicazione di un post (foto, frase o entrambe)
    #spazio   spazio personale cifrato
  I testi visibili arrivano da config/testi_interfaccia.js (attributi data-testo).
-->
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>Bacheca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="stile_comune.css">
    <!-- Installazione come app sul telefono (vedi installazione_app.js) -->
    <link rel="manifest" href="manifest_bacheca.webmanifest">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="../risorse_grafiche/icone/icona_bacheca_apple_180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Bacheca">
</head>
<body class="pagina-con-navigazione">

<!-- Icone disegnate una volta e richiamate con <use> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="icona-casa" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="icona-aggiungi" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icona-quaderno" viewBox="0 0 24 24"><rect x="5" y="3" width="15" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 3v18M3 7h4M3 12h4M3 17h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icona-griglia" viewBox="0 0 24 24"><path d="M3 3h18v18H3zM9 3v18M15 3v18M3 9h18M3 15h18" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="icona-elenco" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 18h16M4 21h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icona-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icona-fotocamera" viewBox="0 0 24 24"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13" r="4" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="icona-persona" viewBox="0 0 24 24"><circle cx="12" cy="9" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4.5 20c1.4-3.6 4.3-5 7.5-5s6.1 1.4 7.5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
</svg>

<header class="barra-superiore">
    <a class="marchio" href="#bacheca">
        <img class="logo-esteso" data-logo-esteso alt="" hidden>
        <img class="logo-piccolo" data-logo data-sostituito-da-logo-esteso alt="">
        <span class="nome-marchio" data-nome-gruppo data-sostituito-da-logo-esteso></span>
    </a>
    <button type="button" class="pulsante-installa-barra" data-installa-app data-testo="pulsanteInstallaApp" hidden></button>
</header>

<main class="contenitore-app">

    <!-- ============ Vista: bacheca ============ -->
    <section id="vista-bacheca" class="vista" aria-labelledby="nome-profilo">
        <div class="scheda-profilo">
            <div class="profilo">
                <div class="anello-logo"><img class="logo-profilo" data-logo alt=""></div>
                <div class="dati-profilo">
                    <h1 class="nome-profilo" id="nome-profilo" data-nome-gruppo></h1>
                    <p class="numero-post" id="numero-post"></p>
                </div>
            </div>
            <ul class="bio-profilo" id="bio-profilo"></ul>
        </div>

        <div class="schede-post" role="tablist">
            <button type="button" role="tab" class="linguetta-post" id="scheda-griglia" aria-selected="true" aria-controls="griglia-post">
                <svg class="icona" aria-hidden="true"><use href="#icona-griglia"/></svg>
                <span class="testo-nascosto" data-testo="schedaGriglia"></span>
            </button>
            <button type="button" role="tab" class="linguetta-post" id="scheda-elenco" aria-selected="false" aria-controls="elenco-post">
                <svg class="icona" aria-hidden="true"><use href="#icona-elenco"/></svg>
                <span class="testo-nascosto" data-testo="schedaElenco"></span>
            </button>
        </div>

        <div class="griglia-post" id="griglia-post" role="tabpanel" aria-labelledby="scheda-griglia"></div>
        <div class="elenco-post" id="elenco-post" role="tabpanel" aria-labelledby="scheda-elenco" hidden></div>
    </section>

    <!-- ============ Vista: nuovo post ============ -->
    <section id="vista-nuovo" class="vista vista-con-margini" aria-labelledby="titolo-nuovo-post" hidden>
        <h2 class="titolo-vista" id="titolo-nuovo-post" data-testo="titoloNuovoPost"></h2>
        <p class="descrizione-vista" data-testo="descrizioneNuovoPost"></p>

        <form class="modulo" id="modulo-nuovo-post" novalidate>
            <div class="area-foto">
                <label class="scelta-foto" id="scelta-foto" for="campo-foto-post">
                    <svg class="icona icona-grande" aria-hidden="true"><use href="#icona-fotocamera"/></svg>
                    <span data-testo="pulsanteScegliFoto"></span>
                </label>
                <img class="anteprima-foto" id="anteprima-foto" alt="" hidden>
                <input class="testo-nascosto" id="campo-foto-post" type="file" accept="image/*">
                <div class="riga-pulsanti" id="azioni-foto" hidden>
                    <label class="pulsante pulsante-secondario" for="campo-foto-post" data-testo="pulsanteCambiaFoto"></label>
                    <button type="button" class="pulsante-secondario" id="pulsante-togli-foto" data-testo="pulsanteTogliFoto"></button>
                </div>
            </div>
            <div class="campo">
                <label for="campo-testo-post" data-testo="etichettaTestoPost"></label>
                <textarea id="campo-testo-post"></textarea>
                <span class="aiuto-campo" id="contatore-caratteri-post" aria-live="polite"></span>
            </div>
            <div class="campo">
                <label for="campo-firma-post" data-testo="etichettaFirma"></label>
                <input id="campo-firma-post" type="text" autocomplete="off" data-testo-segnaposto="segnapostoFirma">
            </div>
            <div class="riga-pulsanti">
                <button type="submit" id="pulsante-pubblica-post" data-testo="pulsantePubblica"></button>
            </div>
            <p class="messaggio-stato" id="stato-nuovo-post" role="status" hidden></p>
        </form>
    </section>

    <!-- ============ Vista: spazio personale ============ -->
    <section id="vista-spazio" class="vista vista-con-margini" aria-labelledby="titolo-spazio" hidden>
        <h2 class="titolo-vista" id="titolo-spazio" data-testo="sezioneSpazio"></h2>
        <p class="descrizione-vista" data-testo="descrizioneSpazio"></p>

        <form class="modulo" id="modulo-accesso-spazio" novalidate>
            <div class="campo">
                <label for="campo-nome-spazio" data-testo="etichettaNomeSpazio"></label>
                <input id="campo-nome-spazio" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
                <span class="aiuto-campo" data-testo="aiutoNomeSpazio"></span>
            </div>
            <div class="campo">
                <label for="campo-password-spazio" data-testo="etichettaPassword"></label>
                <input id="campo-password-spazio" type="password" autocomplete="current-password" required>
            </div>
            <div class="riga-pulsanti">
                <button type="submit" id="pulsante-apri-spazio" data-testo="pulsanteApriSpazio"></button>
                <button type="button" class="pulsante-secondario" id="pulsante-crea-spazio" data-testo="pulsanteCreaSpazio" hidden></button>
            </div>
            <p class="messaggio-stato" id="stato-accesso-spazio" role="status" hidden></p>
        </form>

        <div class="quaderno" id="quaderno-spazio-personale" hidden>
            <h3 class="titolo-quaderno" id="titolo-quaderno"></h3>
            <div class="riga-pulsanti">
                <button type="button" id="pulsante-nuovo-appunto" data-testo="pulsanteNuovoAppunto"></button>
                <button type="button" class="pulsante-secondario" id="pulsante-salva-spazio" data-testo="pulsanteSalva"></button>
                <button type="button" class="pulsante-secondario" id="pulsante-esci-spazio" data-testo="pulsanteEsci"></button>
            </div>
            <p class="messaggio-stato" id="stato-spazio-personale" role="status" hidden></p>
            <div id="elenco-appunti" class="appunti"></div>
            <p class="aiuto-campo" data-testo="consiglioUscita"></p>
        </div>
    </section>

</main>

<nav class="barra-navigazione" aria-label="Navigazione">
    <a class="voce-navigazione" href="#bacheca" data-vista-destinazione="bacheca">
        <svg class="icona" aria-hidden="true"><use href="#icona-casa"/></svg>
        <span class="testo-nascosto" data-testo="navigazioneBacheca"></span>
    </a>
    <a class="voce-navigazione" href="#nuovo" data-vista-destinazione="nuovo">
        <svg class="icona" aria-hidden="true"><use href="#icona-aggiungi"/></svg>
        <span class="testo-nascosto" data-testo="navigazioneNuovoPost"></span>
    </a>
    <a class="voce-navigazione" href="#spazio" data-vista-destinazione="spazio">
        <svg class="icona" aria-hidden="true"><use href="#icona-quaderno"/></svg>
        <span class="testo-nascosto" data-testo="navigazioneSpazio"></span>
    </a>
</nav>

<script src="../config/configurazione.js"></script>
<script src="../config/testi_interfaccia.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="utilita_comuni.js"></script>
<script src="cifratura_spazio_personale.js"></script>
<script src="elaborazione_foto.js"></script>
<script src="servizio_post.js"></script>
<script src="spazio_personale.js"></script>
<script src="pagina_bacheca.js"></script>
<script src="installazione_app.js"></script>
</body>
</html>
